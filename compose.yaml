services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      APP_PASSWORD: ${APP_PASSWORD:?请在服务器.env中设置至少12位访问密码}
      APP_ORIGIN: https://${CRM_DOMAIN:?请设置已解析到服务器的域名}
    volumes:
      - crm-data:/app/data
    expose:
      - "3000"
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?请设置已解析到服务器的域名}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
volumes:
  crm-data:
  caddy-data:
  caddy-config:
